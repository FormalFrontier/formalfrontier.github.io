name: Update and deploy

# Collects the public data once a day at 04:17 UTC, commits it to site/data
# and deploys the site to GitHub Pages. Uses only the built-in token.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --no-deps --require-hashes -r requirements.txt

      - name: Update data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/python scripts/update.py

      - name: Commit data
        run: |
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update data"
          git push

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
